<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giovanna · Lash Specialist</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1208;
    --surface: #fdfaf5;
    --gold: #b8966a;
    --gold-light: #ddc9a8;
    --terra: #9e6b4a;
    --dark: #2a1f14;
    --mid: #7a6a54;
    --light: #b5a48e;
    --card-border: #e8ddd0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
    padding: 48px 24px 64px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, #3d2a1a 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 15% 50%, #2e1f1088 0%, transparent 50%),
      radial-gradient(ellipse 50% 35% at 85% 80%, #c9a96e18 0%, transparent 50%),
      radial-gradient(ellipse 40% 30% at 60% 20%, #4a321866 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 390px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .ornament-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
    animation: fadeUp 0.7s ease both;
  }
  .orn-line { width: 36px; height: 1px; background: var(--gold-light); }
  .orn-diamond {
    width: 6px; height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
    opacity: 0.7;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .photo-wrap {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    margin-bottom: 20px;
    animation: fadeUp 0.7s ease 0.1s both;
  }
  .photo-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 1.5px solid var(--gold-light);
    opacity: 0.6;
  }
  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }
  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.1rem;
    font-weight: 300;
    color: var(--mid);
    letter-spacing: 0.03em;
    text-align: center;
    line-height: 1;
    animation: fadeUp 0.7s ease 0.15s both;
  }
  .name em { font-style: italic; color: var(--gold); }
  .title {
    font-size: 0.62rem;
    font-weight: 300;
    color: var(--light);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-top: 7px;
    margin-bottom: 36px;
    text-align: center;
    line-height: 1.7;
    animation: fadeUp 0.7s ease 0.2s both;
  }
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--card-border);
    border-radius: 3px;
    text-decoration: none;
    color: var(--dark);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .link-btn:nth-child(1) { animation: fadeUp 0.7s ease 0.28s both; }
  .link-btn:nth-child(2) { animation: fadeUp 0.7s ease 0.36s both; }
  .link-btn:nth-child(3) { animation: fadeUp 0.7s ease 0.44s both; }
  .link-btn::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(to bottom, var(--gold), var(--terra));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .link-btn:hover { border-color: var(--gold-light); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(158,107,74,0.1); background: #fefcf8; }
  .link-btn:hover::after { opacity: 1; }
  .link-btn:active { transform: translateY(0); }
  .btn-left { display: flex; align-items: center; gap: 14px; }
  .btn-icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-light), #c9a87055);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-icon svg { width: 16px; height: 16px; stroke: var(--terra); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .btn-text { display: flex; flex-direction: column; gap: 2px; }
  .btn-label { font-size: 0.87rem; font-weight: 300; color: var(--dark); letter-spacing: 0.03em; }
  .btn-sub { font-size: 0.65rem; color: var(--light); letter-spacing: 0.1em; text-transform: uppercase; }
  .btn-arrow { color: var(--gold-light); font-size: 0.9rem; transition: transform 0.3s, color 0.3s; }
  .link-btn:hover .btn-arrow { transform: translateX(3px); color: var(--gold); }
  .footer { margin-top: 36px; text-align: center; animation: fadeUp 0.7s ease 0.52s both; }
  .footer-orn { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .footer-line { width: 28px; height: 1px; background: var(--gold-light); opacity: 0.7; }
  .footer-star { color: var(--gold); font-size: 0.55rem; opacity: 0.8; }
  .footer p { font-size: 0.65rem; color: var(--gold-light); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 300; opacity: 0.5; }
</style>
</head>
